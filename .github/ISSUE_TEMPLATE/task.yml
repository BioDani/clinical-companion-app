name: "Task / Technical Work"
description: "Template for technical tasks, research spikes, or documentation."
title: "[TASK] "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        ### Technical Item Details

  - type: dropdown
    id: task-type
    attributes:
      label: "Subtype"
      description: "Select the specific type of technical work."
      options:
        - "Task (Chore / Refactor / Infrastructure)"
        - "Spike (Research / Proof of Concept)"
        - "Docs (Documentation / Guides)"
      default: 0
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "Describe the technical task, research goal, or documentation scope."
      placeholder: "Describe what needs to be done..."
    validations:
      required: true

  - type: textarea
    id: action-items
    attributes:
      label: "Action Items / Deliverables"
      description: "List the expected deliverables or checklist of steps."
      placeholder: |
        - [ ] Deliverable 1
        - [ ] Deliverable 2
    validations:
      required: true

  - type: textarea
    id: definition-of-done
    attributes:
      label: "Definition of Done"
      value: |
        - [ ] Code/Docs reviewed by a teammate.
        - [ ] Changes merged or documented.
    validations:
      required: false
