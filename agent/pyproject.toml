[project]
name = "clinical-companion"
version = "0.1.0"
requires-python = ">=3.12"

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "optional: graph and LLM tests; run with --run-optional",
]
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
