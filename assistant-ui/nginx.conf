# Resolve Docker service names on each request. A variable in proxy_pass
# is required for that; a URI on the same directive would replace the path.
resolver 127.0.0.11 ipv6=off valid=5s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    set $rbac_upstream rbac:8000;
    set $graph_upstream companion-graph:2024;

    location /auth/ {
        proxy_pass http://$rbac_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/ {
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass http://$graph_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
