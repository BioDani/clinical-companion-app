name: clinical-companion

services:
  rbac:
    # Identity service: https://github.com/ingjohnguerrero/fastapi_rbac
    build:
      context: https://github.com/ingjohnguerrero/fastapi_rbac.git#main
    container_name: clinical-companion-rbac
    ports:
      - "8001:8000"
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      # New file so init can seed ADMIN_* from .env. fastapi_rbac will not
      # update an existing admin hash (old rbac.db stays unused on the volume).
      DATABASE_URL: sqlite:////data/rbac-lab.db
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    volumes:
      - rbac-data:/data
    labels:
      - dev.orbstack.http-port=8000
    command:
      - /bin/sh
      - -c
      - python -m app.cli init && exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 25s
    restart: unless-stopped

  weaviate:
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --scheme
      - http
    image: cr.weaviate.io/semitechnologies/weaviate:1.39.7
    container_name: clinical-companion-weaviate
    ports:
      - "8080:8080"
      - "50051:50051"
    volumes:
      - weaviate_data:/var/lib/weaviate
    restart: unless-stopped
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      CLUSTER_HOSTNAME: "node1"

  agent:
    build:
      context: ./agent
    container_name: clinical-companion-agent
    ports:
      - "8000:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_MODEL: ${HF_MODEL:-Qwen/Qwen2.5-72B-Instruct}
      HF_EMBEDDING_MODEL: ${HF_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      WEAVIATE_HOST: weaviate
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      TAVILY_API_KEY: ${TAVILY_API_KEY:?Set TAVILY_API_KEY in .env}
    labels:
      - dev.orbstack.http-port=8000
    depends_on:
      rbac:
        condition: service_healthy
      weaviate:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.3
    container_name: clinical-companion-ui
    ports:
      - "3000:8080"
    environment:
      OPENAI_API_BASE_URL: http://agent:8000/v1
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      ENABLE_PERSISTENT_CONFIG: "false"
      WEBUI_AUTH: "false"
      RBAC_URL: http://rbac:8000
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    volumes:
      - ./scripts/open-webui-entrypoint.py:/open-webui-entrypoint.py:ro
      - open-webui-data:/app/backend/data
    labels:
      - dev.orbstack.http-port=8080
    command: ["python3", "/open-webui-entrypoint.py"]
    depends_on:
      rbac:
        condition: service_healthy
      agent:
        condition: service_healthy
    restart: unless-stopped

volumes:
  open-webui-data:
  rbac-data:
  weaviate_data:
