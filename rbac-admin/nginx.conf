# Resolve the rbac service name on each request instead of a cached address.
resolver 127.0.0.11 ipv6=off valid=5s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    set $rbac_upstream rbac:8000;

    location /auth/ {
        proxy_pass http://$rbac_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /users {
        proxy_pass http://$rbac_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /roles {
        proxy_pass http://$rbac_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    set $agent_upstream agent:8000;

    # A variable in proxy_pass replaces the whole request path. Rewrite first,
    # then proxy the host only, so /api/knowledge and /api/knowledge/files
    # both keep their /knowledge path on the agent.
    location /api/knowledge {
        client_max_body_size 64m;
        rewrite ^/api(/knowledge.*)$ $1 break;
        proxy_pass http://$agent_upstream;
        add_header Cache-Control "no-store" always;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # The agent checks the bearer token before it returns the PDF.
    location /knowledge/files/ {
        proxy_pass http://$agent_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
