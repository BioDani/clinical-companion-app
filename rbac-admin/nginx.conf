server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /auth/ {
        proxy_pass http://rbac:8000;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /users {
        proxy_pass http://rbac:8000;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /roles {
        proxy_pass http://rbac:8000;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
